org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configureondemand=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=36
android.bundle.enableNativeLibraryDebugSymbolExtraction=false
# Play Console: use R8 full mode (not compatibility) with minify/shrink/obfuscate.
android.enableR8.fullMode=true
